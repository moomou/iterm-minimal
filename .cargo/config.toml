[target.aarch64-apple-darwin]
linker = "scripts/darwin-ld.sh"
rustflags = [
  "-C", "linker-flavor=ld64.lld",
  "-C", "link-arg=-arch", "-C", "link-arg=arm64",
]

[target.x86_64-apple-darwin]
linker = "scripts/darwin-ld.sh"
rustflags = [
  "-C", "linker-flavor=ld64.lld",
  "-C", "link-arg=-arch", "-C", "link-arg=x86_64",
]

[build]
jobs = 4
